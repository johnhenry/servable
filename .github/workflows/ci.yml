name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: servable
      # packfile isn't published yet -- the examples/08-mount-packfile example
      # and its regression test use it via a devDependency on
      # file:../packfile, which needs a sibling checkout to resolve. Drop
      # this once packfile is published for real (see how leserve's own
      # equivalent workaround was removed once @johnhenry/leserve was
      # published).
      - uses: actions/checkout@v4
        with:
          repository: johnhenry/packfile
          path: packfile
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # --install-links: without it, npm's file:../packfile devDependency
      # doesn't install *packfile's own* dependencies (cbor) at all --
      # confirmed by reproducing it in a clean install, not just reasoning
      # about it. This flag makes npm treat a file: dependency as a real
      # packed install instead of a shallow symlink, which resolves its
      # transitive deps normally.
      - run: npm ci --install-links
        working-directory: servable
      - run: npm test
        working-directory: servable
