name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node >=26.0.0 -- test the floor version directly rather
        # than a matrix of now-unsupported older majors.
        node-version: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: servable
      # packfile isn't published yet -- the examples/08-mount-packfile example
      # and its regression test use it via a devDependency on
      # file:../packfile, which needs a sibling checkout to resolve. Drop
      # this once packfile is published for real (see how leserve's own
      # equivalent workaround was removed once @johnhenry/leserve was
      # published).
      - uses: actions/checkout@v4
        with:
          repository: johnhenry/packfile
          path: packfile
      # fileable isn't published with its current API yet (encode=/decode=,
      # <IPFS>, <MarkdownHTML>, ipfs://, ...) -- the mount-fileable tests use
      # it via a devDependency on file:../fileable, which needs a sibling
      # checkout to resolve. Drop this (and the build step below) once
      # fileable is published for real, same as the packfile workaround
      # above.
      - uses: actions/checkout@v4
        with:
          repository: johnhenry/fileable
          path: fileable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # fileable's dist/ is gitignored, never committed -- the sibling
      # checkout only has source, so it has to be built before servable can
      # import it (its package.json main/types point at dist/).
      - run: npm ci --install-links
        working-directory: fileable
      - run: npm run build
        working-directory: fileable
      # --install-links: without it, npm's file:../packfile and
      # file:../fileable devDependencies don't install *their own*
      # dependencies (cbor, wbn, glob, ...) at all -- confirmed by
      # reproducing it in a clean install, not just reasoning about it.
      # This flag makes npm treat a file: dependency as a real packed
      # install instead of a shallow symlink, which resolves its
      # transitive deps normally.
      - run: npm ci --install-links
        working-directory: servable
      - run: npm test
        working-directory: servable
